# A resposta para «de onde vem esse número». Lê a confiança e o número de
# modelos direto do sensor de confiança — é a honestidade virando fala.
MWTempoFontes:
  speech:
    text: >-
      {% set c = states.sensor | selectattr('attributes.leitura','defined')
                               | selectattr('attributes.modelos','defined')
                               | map(attribute='entity_id') | list | first %}
      {% if c %}
      A temperatura vem de {{ state_attr(c,'modelos') }} modelos de previsão fundidos,
      e agora eles estão com {{ state_attr(c,'leitura') }}.
      {% else %}
      Ainda não consegui comparar as fontes.
      {% endif %}
