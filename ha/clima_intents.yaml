# Respostas locais de clima. APPEND idempotente em /config/despertar_intents.yaml
# (que já é incluído por `intent_script: !include despertar_intents.yaml`).
#
# ARMADILHA CONTORNADA: `speech` NÃO enxerga `response_variable` de `action`.
# É por isso que aqui não há `action:` nenhuma — a frase já vem pronta como
# ATRIBUTO do sensor, montada em pt-BR pela própria integração. Sem helper de
# relay, sem `input_text`, sem segunda verdade.
#
# A busca do sensor é por ATRIBUTO, não por entity_id: assim o mesmo arquivo
# serve para qualquer nome de local, e não quebra se o dono renomear a entidade.

MWTempoAgora:
  speech:
    text: >-
      {% set s = states.sensor | selectattr('attributes.fala_agora','defined')
                               | map(attribute='entity_id') | list | first %}
      {{ state_attr(s,'fala_agora') if s else 'Ainda não tenho a previsão do tempo aqui.' }}

