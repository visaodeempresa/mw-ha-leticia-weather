[project]
name = "mw-ha-leticia-weather"
version = "0.1.3"
description = "Temperatura e previsão confiáveis no Home Assistant por fusão de modelos, com a discórdia publicada junto"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["custom_components", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
